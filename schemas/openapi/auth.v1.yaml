openapi: 3.0.3
info:
  title: Socset Auth API
  description: |
    Публичные auth-эндпоинты через api-gateway.
    Access — JWT (Bearer). Refresh — opaque, в body.
    Logout требует Bearer access + refresh в body; access попадает в Redis denylist.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local api-gateway

tags:
  - name: auth
    description: Регистрация, логин, токены

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: alice@example.com
              username: alice
              password: "secret123"
      responses:
        "200":
          description: Успех — пользователь создан, выдана пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokensResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email или username заняты
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [auth]
      summary: Логин (email или username)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              login: alice
              password: "secret123"
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokensResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Неверные учётные данные
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Ротация refresh и новый access
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Невалидный refresh
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout — revoke refresh + denylist access (jti)
      description: |
        Требует `Authorization: Bearer <access>`.
        В body — `refresh_token`. После успеха access отклоняется до exp.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Сессия отозвана
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      tags: [auth]
      summary: Текущий user_id из access JWT
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subject из JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (HS256, claim sub = user_id, jti для denylist)

  responses:
    BadRequest:
      description: Невалидный JSON / аргументы
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Нет или невалидный / отозванный access
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Внутренняя ошибка
      content:
        text/plain:
          schema:
            type: string
            example: internal error

  schemas:
    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Email или username
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthTokensResponse:
      type: object
      required: [user_id, access_token, refresh_token, expires_in]
      properties:
        user_id:
          type: string
          format: uuid
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: TTL access в секундах

    RefreshResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64

    AuthMeResponse:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
