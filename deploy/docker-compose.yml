services:
  postgres:
    image: postgres:18-alpine
    ports: 
    - "${postgres_port}:5432"
    environment:
      POSTGRES_USER: ${postgres_user}
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: ${postgres_db}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d


  redis:
    image: redis:alpine
    ports: 
    - "${redis_port}:6379"
    volumes:
      - redis_data:/data


  minio:
    image: minio/minio:latest
    ports: 
    - "${minio_port}:9000"
    - "${minio_port_alt}:9001"
    environment:
      MINIO_ROOT_USER: ${minio_user}
      MINIO_ROOT_PASSWORD: ${minio_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data


  elasticsearch:
    image: elasticsearch:9.4.4
    ports: 
      - "${elasticsearch_port}:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports: 
    - "${jaeger_port}:16686"
    - "${jaeger_port_alt}:4317"

  kafka:
    image: redpandadata/redpanda:v26.1.15

    ports: 
    - "${kafka_port}:9092"
    command: 
    - redpanda 
    - start
    - --kafka-addr=internal://0.0.0.0:9092
    - --advertise-kafka-addr=internal://kafka:9092
    - --smp=1
    - --mode=dev-container

    volumes:
      - kafka_data:/var/lib/redpanda/data


  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: deploy/docker/auth-service.Dockerfile
    ports:
      - "${auth_service_port}:8080"
    environment:
      - POSTGRES_URL=${postgres_url_for_auth_service}
      - KAFKA_BROKERS=${kafka_brokers}
      - JWT_SECRET=${jwt_secret}
      - GRPC_ADDR=:8080
    depends_on:
      - postgres
      - redis
      - kafka
      - elasticsearch
      - jaeger
      - minio

  profile-service:
    build:
      context: ../services/profile-service
      dockerfile: deploy/docker/profile-service.Dockerfile
    ports:
      - "${profile_service_port}:8080"
    environment:
      - POSTGRES_URL=${postgres_url_for_profile_service}
      - KAFKA_BROKERS=${kafka_brokers}
      - GRPC_ADDR=:8080
    depends_on:
      - postgres
      - redis
      - kafka
      - elasticsearch
      - jaeger
      - minio
    
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: deploy/docker/api-gateway.Dockerfile
    ports:
      - "${api_gateway_port}:8080"
    environment:
      - JWT_SECRET=${jwt_secret}
      - REDIS_ADDR=${REDIS_ADDR}
      - GRPC_ADDR_AUTH=${GRPC_ADDR_AUTH}
      - GRPC_ADDR_PROFILE=${GRPC_ADDR_PROFILE}
      - HTTP_ADDR=${HTTP_ADDR}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME}
    depends_on:
      - auth-service
      - profile-service
      - postgres
      - redis
      - kafka
      - elasticsearch
      - jaeger
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  elasticsearch_data:
  kafka_data:
