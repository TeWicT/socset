x-time-settings: &time-settings
  volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
  environment:
    - TZ=Europe/Moscow


services:
  postgres:
    image: postgres:18-alpine
    <<: *time-settings
    ports: 
    - "${postgres_port}:5432"
    environment:
      POSTGRES_USER: ${postgres_user}
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: ${postgres_db}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${postgres_user} -d ${postgres_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    <<: *time-settings
    ports: 
    - "${redis_port}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  minio:
    image: minio/minio:latest
    <<: *time-settings
    ports: 
    - "${minio_port}:9000"
    - "${minio_port_alt}:9001"
    environment:
      MINIO_ROOT_USER: ${minio_user}
      MINIO_ROOT_PASSWORD: ${minio_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data


  elasticsearch:
    image: elasticsearch:9.4.4
    <<: *time-settings
    ports: 
      - "${elasticsearch_port}:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    <<: *time-settings
    ports: 
    - "${jaeger_port}:16686"
    - "${jaeger_port_alt}:4317"

  kafka:
    image: redpandadata/redpanda:v26.1.15
    <<: *time-settings
    ports: 
    - "${kafka_port}:9092"
    command: 
    - redpanda 
    - start
    - --kafka-addr=internal://0.0.0.0:9092
    - --advertise-kafka-addr=internal://kafka:9092
    - --smp=1
    - --mode=dev-container

    volumes:
      - kafka_data:/var/lib/redpanda/data

    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: deploy/docker/auth-service.Dockerfile
    <<: *time-settings
    ports:
      - "${auth_service_port}:8080"
    environment:
      - POSTGRES_URL=${postgres_url_for_auth_service}
      - KAFKA_BROKERS=${kafka_brokers}
      - JWT_SECRET=${jwt_secret}
      - GRPC_ADDR=:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME_AUTH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      jaeger:
        condition: service_started
      minio:
        condition: service_started

  profile-service:
    build:
      context: ../services/profile-service
      dockerfile: deploy/docker/profile-service.Dockerfile
    <<: *time-settings
    ports:
      - "${profile_service_port}:8080"
    environment:
      - POSTGRES_URL=${postgres_url_for_profile_service}
      - KAFKA_BROKERS=${kafka_brokers}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME_PROFILE}
      - GRPC_ADDR=:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      jaeger:
        condition: service_started
      minio:
        condition: service_started
    
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: deploy/docker/api-gateway.Dockerfile
    <<: *time-settings
    ports:
      - "${api_gateway_port}:8080"
    environment:
      - JWT_SECRET=${jwt_secret}
      - REDIS_ADDR=${REDIS_ADDR}
      - GRPC_ADDR_AUTH=${GRPC_ADDR_AUTH}
      - GRPC_ADDR_PROFILE=${GRPC_ADDR_PROFILE}
      - GRPC_ADDR_SOCIAL_GRAPH=${GRPC_ADDR_SOCIAL_GRAPH}
      - HTTP_ADDR=${HTTP_ADDR}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
      profile-service:
        condition: service_started
      social-graph-service:
        condition: service_started
      elasticsearch:
        condition: service_started
      jaeger:
        condition: service_started
      minio:
        condition: service_started

  social-graph-service:
    build:
      context: ../services/social-graph-service
      dockerfile: deploy/docker/social-graph-service.Dockerfile
    <<: *time-settings
    ports:
      - "${social_graph_service_port}:8080"
    environment:
      - POSTGRES_URL=${postgres_url_for_social_graph_service}
      - KAFKA_BROKERS=${kafka_brokers}
      - GRPC_ADDR=:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME_SOCIAL_GRAPH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      jaeger:
        condition: service_started
      minio:
        condition: service_started


volumes:
  postgres_data:
  redis_data:
  minio_data:
  elasticsearch_data:
  kafka_data:
